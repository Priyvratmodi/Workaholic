<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Card Subtle Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>

    <!-- Column 2 Sparkle Highlight -->
    <linearGradient id="colGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" />

  <!-- Subtle Inset Gloss Border -->
  <rect x="8" y="8" width="240" height="240" rx="56" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Inner Kanban Swimlane Columns -->
  <g filter="url(#cardShadow)">
    <!-- Left Column (Backlog / To-Do) -->
    <rect x="52" y="68" width="42" height="112" rx="10" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="59" y="78" width="28" height="22" rx="5" fill="#4F46E5" fill-opacity="0.2" />
    <rect x="59" y="106" width="28" height="34" rx="5" fill="#4F46E5" fill-opacity="0.2" />
    <rect x="59" y="146" width="28" height="20" rx="5" fill="#4F46E5" fill-opacity="0.2" />

    <!-- Center Column (In Progress - Highlighted & Taller) -->
    <rect x="107" y="52" width="42" height="144" rx="10" fill="url(#colGlow)" />
    <rect x="114" y="64" width="28" height="38" rx="5" fill="#4F46E5" fill-opacity="0.35" />
    <rect x="114" y="108" width="28" height="48" rx="5" fill="#6366F1" fill-opacity="0.35" />
    <rect x="114" y="162" width="28" height="22" rx="5" fill="#7C3AED" fill-opacity="0.3" />

    <!-- Right Column (Done / Complete) -->
    <rect x="162" y="76" width="42" height="104" rx="10" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="169" y="86" width="28" height="32" rx="5" fill="#10B981" fill-opacity="0.25" />
    <rect x="169" y="124" width="28" height="44" rx="5" fill="#10B981" fill-opacity="0.25" />
  </g>

  <!-- Mini Sparkle Icon on Center Column (Representing AI & Polish) -->
  <circle cx="140" cy="46" r="3" fill="#FCD34D" />
  <path d="M140 37 L142 42 L147 44 L142 46 L140 51 L138 46 L133 44 L138 42 Z" fill="#FCD34D" />
</svg>
