services:
  - type: web
    name: workaholic-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: workaholic-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: COOKIE_SAME_SITE
        value: lax
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: workaholic-db
    databaseName: workaholic
    user: workaholic
    plan: free
    region: oregon
