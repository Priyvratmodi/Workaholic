version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workaholic-postgres
    restart: always
    environment:
      POSTGRES_USER: workaholic
      POSTGRES_PASSWORD: workaholic_dev_password
      POSTGRES_DB: workaholic
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
